<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Familia Burgada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="ft-layout">

  <div class="ft-header">
    <div class="ft-header-left">
      <h1 class="ft-title">Familia Burgada</h1>
      <span class="ft-count" id="ft-count"></span>
      <a href="stats.html" class="ft-stats-link">📊 Estadísticas</a>
    </div>
    <div class="ft-header-right">
      <label class="ft-gen-filter">
        Generación
        <select id="generation-filter"><option value="all">Todas</option></select>
      </label>
      <div class="ft-search">
        <input id="ft-search-input" class="ft-input" placeholder="Buscar persona…" />
      </div>
    </div>
  </div>

  <div class="ft-lineage-bar hidden" id="ft-lineage-bar">
    <span id="ft-lineage-text"></span>
    <button class="ft-btn-small" id="ft-lineage-clear">✕ Quitar linaje</button>
  </div>

  <div class="ft-body">
    <div class="ft-sidebar">
      <button class="ft-zoom-btn" id="zoom-in" title="Acercar">+</button>
      <span class="ft-zoom-val" id="zoom-label">100 %</span>
      <button class="ft-zoom-btn" id="zoom-out" title="Alejar">−</button>
      <div class="ft-sidebar-sep"></div>
      <button class="ft-zoom-btn" id="zoom-reset" title="Reset">↺</button>
      <div class="ft-sidebar-sep"></div>
      <button class="ft-zoom-btn" id="orientation-toggle" title="Cambiar orientación">
        <span id="orientation-label">↓</span>
      </button>
    </div>

    <div class="ft-viewport" id="ft-viewport">
      <div class="ft-canvas" id="ft-canvas"></div>
    </div>

    <!-- Modal -->
    <div class="ft-modal-backdrop" id="ft-modal-backdrop">
      <div class="ft-modal">
        <button class="ft-modal-close" id="ft-modal-close">✕</button>
        <div class="ft-modal-header">
          <div class="ft-modal-avatar" id="modal-avatar"></div>
          <div>
            <div class="ft-modal-badge" id="modal-relation"></div>
            <h2 id="modal-name"></h2>
            <div class="ft-modal-sub" id="modal-dates"></div>
          </div>
        </div>
        <div class="ft-modal-body" id="modal-description"></div>
        <div class="ft-modal-lineage" id="modal-lineage"></div>
        <div class="ft-modal-grid">
          <div class="ft-modal-card"><div class="ft-modal-label">Generación</div><div class="ft-modal-value" id="modal-gen"></div></div>
          <div class="ft-modal-card"><div class="ft-modal-label">Lugar de nacimiento</div><div class="ft-modal-value" id="modal-birthplace"></div></div>
          <div class="ft-modal-card"><div class="ft-modal-label">Pareja</div><div class="ft-modal-value" id="modal-spouse"></div></div>
          <div class="ft-modal-card"><div class="ft-modal-label">Hijos</div><div class="ft-modal-value" id="modal-children"></div></div>
          <div class="ft-modal-card" style="grid-column:1/-1"><div class="ft-modal-label">Notas</div><div class="ft-modal-value" id="modal-notes"></div></div>
        </div>
        <div class="ft-modal-actions">
          <button class="ft-btn-outline" id="modal-trace-lineage">🌳 Ver linaje</button>
          <button class="ft-btn-outline" id="modal-propose-change">📝 Proponer cambio</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Request panel -->
  <div class="ft-request-panel">
    <div class="ft-request-toggle" id="request-toggle">
      <span>📝</span> Solicitar cambio de información
      <span class="ft-chevron" id="request-chevron">▾</span>
    </div>
    <div class="ft-request-body hidden" id="request-body">
      <p class="ft-request-hint">
        Rellena este formulario y se abrirá un email pre-rellenado para enviar la solicitud.
      </p>
      <form id="request-form">
        <div>
          <label for="req-reporter">Tu nombre</label>
          <input id="req-reporter" type="text" placeholder="Ej: Ana Pérez" required />
        </div>
        <div>
          <label for="req-type">Tipo de cambio</label>
          <select id="req-type" required>
            <option value="">Selecciona…</option>
            <option value="Modificar datos">Modificar datos</option>
            <option value="Nuevo nacimiento">Nuevo nacimiento</option>
            <option value="Fallecimiento">Fallecimiento</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div>
          <label for="req-person-name">Persona relacionada</label>
          <input id="req-person-name" type="text" placeholder="Ej: María Isabel Burgada" />
        </div>
        <div style="grid-column:1/-1">
          <label for="req-details">Detalles</label>
          <textarea id="req-details" placeholder="Ej: Nuevo nacimiento: Nombre, fecha, padres…"></textarea>
        </div>
        <div class="ft-form-actions" style="grid-column:1/-1">
          <button type="submit" class="ft-btn">✉ Enviar por email</button>
        </div>
      </form>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
